apply plugin: 'com.android.library'

android {
    namespace "com.afgai.jarvis"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
    }
}

def androidxActivityVersion = rootProject.ext.has('androidxActivityVersion')
    ? rootProject.ext.androidxActivityVersion
    : '1.11.0'

dependencies {
    implementation project(':capacitor-android')
    // Capacitor's ActivityResult callback type is AndroidX; expose it on this
    // plugin module's compile classpath instead of relying on transitive internals.
    implementation "androidx.activity:activity:$androidxActivityVersion"
    // On-device Vosk speech recognition; the user imports model weights separately.
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
}
