name: AFG AI CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Locale dictionaries
        run: npm run i18n:check
      - name: Production build
        run: npm run build
      - name: DB-free regression suites
        run: |
          npm run test:offline-sha
          npm run test:offline-download
          npm run test:osint
          npm run test:database-config
          npm run test:admin-rbac
          npm run test:bridge-auth
          npm run test:jarvis-command
          npm run test:core-state
          npm run test:chat-stream
          npm run test:chat-persistence
          npm run test:image-adapter
          npm run test:provider-smoke
          npm run test:migrations

  web-next:
    name: web-next (Next.js 16 app)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies (bun lockfile)
        working-directory: apps/web-next
        run: bun install --frozen-lockfile
      - name: Prisma client generate
        working-directory: apps/web-next
        run: bun run db:generate
      - name: Lint (eslint)
        working-directory: apps/web-next
        run: bun run lint
      - name: Type check (tsc)
        working-directory: apps/web-next
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: apps/web-next
        run: bun run test
      - name: i18n parity check
        working-directory: apps/web-next
        run: bun run i18n:parity
      - name: Production build
        working-directory: apps/web-next
        env:
          DATABASE_URL: file:./prisma/build-check.db
          AFG_SESSION_SECRET: ci-build-only-secret-0123456789abcdef0123456789abcdef
          AFG_VAULT_KEY: ci-build-only-vaultkey-0123456789abcdef0123456789ab
        run: bun run build
      - name: Cleanup build database
        if: always()
        working-directory: apps/web-next
        run: rm -f prisma/build-check.db

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afg_agent_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d afg_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/afg_agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Conversation ownership, CSRF and idempotency
        run: npm run test:conversation-isolation
      - name: Server-side chat message persistence (Phase 3)
        run: npm run test:chat-persistence-integration
      - name: Agent lifecycle and isolation
        run: npm run test:agent-engine
      - name: Multi-instance live event fan-out
        run: npm run test:multi-instance-fanout
      - name: Provider smoke tests (9Router, Ollama, OpenAI-compatible)
        run: npm run test:provider-smoke

  media-engine:
    name: Media engine (ClamAV integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afg_agent_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d afg_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/afg_agent_test
      AFG_CLAMSCAN_PATH: /usr/bin/clamscan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Install ClamAV and update signatures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --quiet || sudo freshclam --quiet
      - name: Media engine integration (upload quarantine, scan, storage)
        run: npm run test:media-engine
