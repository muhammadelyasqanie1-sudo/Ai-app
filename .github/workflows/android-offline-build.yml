name: Android offline hub build
on:
  pull_request:
    paths:
      - 'src/components/afg/AfgOfflineHubView.tsx'
      - 'src/components/afg/AfgJarvisView.tsx'
      - 'src/lib/jarvis-local-agent.ts'
      - 'src/lib/jarvis-command-engine.ts'
      - 'src/lib/offline*.ts'
      - 'src/lib/huggingFaceOfflineCatalog.ts'
      - 'plugins/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android-offline-build.yml'
  workflow_dispatch:
concurrency:
  group: android-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install native build tools
        run: sdkmanager 'cmake;3.31.6' 'ndk;29.0.13113456'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor plugins and assets
        run: npx cap sync android
      - name: Assemble debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: afg-ai-offline-hub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
